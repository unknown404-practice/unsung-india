version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unsung_heroes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unsung_heroes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: unsung_heroes_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend/src:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/unsung_heroes
      - JWT_SECRET_KEY=local_development_secret_key_123456789
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      - postgres

volumes:
  pgdata:
