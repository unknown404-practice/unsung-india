version: '3.8'

services:
  # 1. Local Containerized Ollama Qwen AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: unsung_heroes_prod_ollama
    restart: always
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # 2. Automated Model Puller (Pulls Qwen 2.5 automatically on container startup)
  ollama-pull:
    image: curlimages/curl:latest
    container_name: unsung_heroes_ollama_pull
    restart: "no"
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama container to start...';
        while ! curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Ollama is online. Pulling Qwen 2.5 model (${OLLAMA_MODEL:-qwen2.5:7b})...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL:-qwen2.5:7b}\"}';
        echo 'Qwen 2.5 model successfully provisioned inside Docker!';
      "

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: unsung_heroes_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-unsung_heroes}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unsung_heroes_prod_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-unsung_heroes}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-production_secret_key_change_in_env}
      - ALLOWED_ORIGINS=["http://localhost:3000","https://unsungheroes.in","https://*.vercel.app"]
      - OLLAMA_API_URL=http://ollama:11434/api/generate
      - DEFAULT_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Next.js Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unsung_heroes_prod_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api/v1
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    depends_on:
      - backend
      - ollama

volumes:
  pgdata_prod:
  ollama_models:

